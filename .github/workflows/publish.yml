name: Publish documentation

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [documentation-updated]
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portal
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install portal dependencies
        run: pip install -r requirements.txt

      - name: Discover documentation repositories
        env:
          GH_TOKEN: ${{ secrets.COGNITYX_DOCS_READ_TOKEN }}
        run: |
          python3 scripts/discover_components.py \
            --organization cognityx \
            --overrides components.json \
            --sources-root .sources \
            --output .build/components.json \
            --directory-page docs/components/discovered.md

      - name: Build portal
        run: mkdocs build --strict --site-dir .build/portal

      - name: Build component sites
        run: python3 scripts/build_components.py --manifest .build/components.json --output-root .build/components

      - name: Assemble portal
        run: |
          python3 scripts/build_portal.py \
            --portal-site .build/portal \
            --components-root .build/components \
            --manifest .build/components.json \
            --output site

      - name: Check internal links
        run: python3 scripts/check_links.py site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
