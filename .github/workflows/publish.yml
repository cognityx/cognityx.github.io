name: Publish documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portal
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install portal dependencies
        run: pip install -r requirements.txt

      - name: Check out Core documentation
        uses: actions/checkout@v4
        with:
          repository: cognityx/cognityx-core
          token: ${{ secrets.COGNITYX_DOCS_READ_TOKEN }}
          path: .sources/core

      - name: Check out Training documentation
        uses: actions/checkout@v4
        with:
          repository: cognityx/cognityx-training
          token: ${{ secrets.COGNITYX_DOCS_READ_TOKEN }}
          path: .sources/training

      - name: Check out Storage documentation
        uses: actions/checkout@v4
        with:
          repository: cognityx/cognityx-storage
          token: ${{ secrets.COGNITYX_DOCS_READ_TOKEN }}
          path: .sources/storage

      - name: Check out Inference documentation
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: cognityx/cognityx-inference
          token: ${{ secrets.COGNITYX_DOCS_READ_TOKEN }}
          path: .sources/inference

      - name: Build portal
        run: mkdocs build --strict --site-dir .build/portal

      - name: Build component sites
        run: |
          for component in core inference training storage; do
            if [ -f ".sources/${component}/mkdocs.yml" ]; then
              mkdocs build --strict \
                --config-file ".sources/${component}/mkdocs.yml" \
                --site-dir "${GITHUB_WORKSPACE}/.build/components/${component}"
            fi
          done

      - name: Assemble portal
        run: python3 scripts/build_portal.py --portal-site .build/portal --components-root .build/components --output site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
